[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "AtomicStudio"
name = "ModConfig"
description = "A feature rich config editor for in-game!"
websiteUrl = "https://atomictyler.dev/"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2304"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/ModConfig/release/com.atomic.modconfig.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "super-battle-golf", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/super-battle-golf/category/
super-battle-golf = [ "mods", ]
